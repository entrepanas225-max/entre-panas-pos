<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dc2626">
<meta name="description" content="Entre Panas · Punto de venta para pizzería y comidas rápidas: mesas, domicilios, cocina y caja.">
<title>Entre Panas · GastroApp POS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23dc2626'/%3E%3Cpath d='M12 4c3 0 5.8.8 7.7 2.2L12 21 4.3 6.2C6.2 4.8 9 4 12 4Z' fill='%23fde68a'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icono.svg">
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

<!-- ================= ICONOS (SVG en línea, sin CDN) ================= -->
<svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">
  <symbol id="i-pizza" viewBox="0 0 24 24"><path d="M12 3c3.6 0 6.9 1 9 2.6L12 21 3 5.6C5.1 4 8.4 3 12 3Z"/><path d="M12 12.2h.01M9.6 15.6h.01M14.6 15.9h.01"/></symbol>
  <symbol id="i-mesa" viewBox="0 0 24 24"><path d="M5 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M7.5 12.5V21"/><path d="M16.5 3c-1.5 1.6-2 3.6-2 6 0 1.6.7 2.5 2 2.8V21"/></symbol>
  <symbol id="i-moto" viewBox="0 0 24 24"><circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M9 17h5.5l3.5-6.5h2"/><path d="m15 10.5-3.5-4H9"/></symbol>
  <symbol id="i-fuego" viewBox="0 0 24 24"><path d="M12 21.5c3.6 0 6-2.4 6-5.8 0-4.2-3.7-5.5-3.3-9.7 0 0-2.3 1.3-2.3 3.6 0-1-1.4-2.2-2.2-3.1C8.4 8.2 6 10.8 6 13.7c0 4.4 2.4 7.8 6 7.8Z"/></symbol>
  <symbol id="i-caja" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V9"/><path d="M7 14h5"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><rect x="6" y="7" width="12" height="13" rx="2"/></symbol>
  <symbol id="i-recibo" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9.5 8h5M9.5 12h5"/></symbol>
  <symbol id="i-enviar" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 3 3 7L21 3Z"/><path d="m10 13.5 4-4"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-candado" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-impresora" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="5" rx="1"/><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 16h10v5H7z"/></symbol>
  <symbol id="i-efectivo" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-tarjeta" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></symbol>
  <symbol id="i-transf" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 10h7M8.5 14h7"/></symbol>
  <symbol id="i-usuario" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></symbol>
  <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M3 20h18"/><rect x="5" y="11" width="3.5" height="6"/><rect x="10.5" y="7" width="3.5" height="10"/><rect x="16" y="13" width="3.5" height="4"/></symbol>
</svg>

<!-- ================= ENCABEZADO ================= -->
<header class="bg-red-600 text-white px-3 py-2.5 shadow-md sticky top-0 z-30 flex items-center justify-between gap-2 pt-safe">
  <div class="flex items-center gap-2.5 min-w-0">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-red-700/50 ring-1 ring-white/25">
      <svg class="h-6 w-6 ico"><use href="#i-pizza"/></svg>
    </span>
    <div class="min-w-0">
      <h1 class="font-bold text-lg leading-tight truncate">Entre Panas</h1>
      <p class="text-[11px] text-red-100 -mt-0.5 truncate">Pizzería &amp; Comidas Rápidas</p>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <span id="reloj" class="hidden sm:inline text-[11px] font-medium text-red-100 tabular-nums"></span>
    <span id="badgeCaja" class="text-[11px] px-2.5 py-1 rounded-full font-semibold flex items-center bg-red-800">
      <span class="h-2 w-2 rounded-full bg-red-300 mr-1.5"></span>Caja cerrada
    </span>
  </div>
</header>

<!-- ================= CONTENIDO ================= -->
<main class="flex-1 w-full max-w-4xl mx-auto px-3 pt-3 pb-24">

  <!-- MESAS -->
  <section id="sec-mesas" class="tab-content">
    <div class="flex items-end justify-between mb-3">
      <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
        <svg class="h-5 w-5 ico text-red-500"><use href="#i-mesa"/></svg> Control de mesas
      </h2>
      <span id="resumenMesas" class="text-xs text-slate-500"></span>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="gridMesas"></div>
  </section>

  <!-- DOMICILIOS -->
  <section id="sec-domicilios" class="tab-content hidden">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
        <svg class="h-5 w-5 ico text-red-500"><use href="#i-moto"/></svg> Domicilios
      </h2>
      <button data-accion="nuevo-domicilio" class="bg-red-600 hover:bg-red-700 active:scale-95 transition text-white text-xs font-bold px-3 py-2 rounded-lg shadow flex items-center gap-1">
        <svg class="h-4 w-4 ico"><use href="#i-mas"/></svg> Nuevo pedido
      </button>
    </div>
    <div id="listaDomicilios" class="space-y-3"></div>
  </section>

  <!-- COCINA -->
  <section id="sec-cocina" class="tab-content hidden">
    <div class="flex items-end justify-between mb-3">
      <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
        <svg class="h-5 w-5 ico text-red-500"><use href="#i-fuego"/></svg> Comandas en vivo
      </h2>
      <span id="resumenCocina" class="text-xs text-slate-500"></span>
    </div>
    <div id="gridCocina" class="space-y-3"></div>
  </section>

  <!-- CAJA -->
  <section id="sec-caja" class="tab-content hidden space-y-3">
    <div class="bg-white p-4 rounded-xl shadow-sm ring-1 ring-slate-200">
      <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
        <svg class="h-5 w-5 ico text-red-500"><use href="#i-candado"/></svg> Control de caja
      </h2>
      <div id="cajaBloqueEstado"></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm ring-1 ring-slate-200">
      <h3 class="font-bold text-slate-700 mb-2 flex items-center gap-2 text-sm">
        <svg class="h-4 w-4 ico text-red-500"><use href="#i-grafico"/></svg> Ventas del turno
      </h3>
      <div id="resumenVentas" class="space-y-1.5 text-sm text-slate-600"></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm ring-1 ring-slate-200">
      <h3 class="font-bold text-slate-700 mb-2 text-sm">Historial de turnos</h3>
      <div id="historialTurnos" class="space-y-2 text-sm text-slate-600"></div>
    </div>
  </section>
</main>

<!-- ================= NAVEGACIÓN ================= -->
<nav class="bg-white border-t border-slate-200 fixed bottom-0 inset-x-0 z-30 flex shadow-[0_-4px_16px_rgba(0,0,0,.06)] pb-safe" aria-label="Navegación principal">
  <button data-accion="tab" data-tab="mesas" id="tab-mesas" class="tab-btn flex-1 py-2 flex flex-col items-center gap-0.5 transition-colors" aria-selected="true">
    <svg class="h-5 w-5 ico"><use href="#i-mesa"/></svg>
    <span class="text-[11px] font-semibold">Mesas</span>
  </button>
  <button data-accion="tab" data-tab="domicilios" id="tab-domicilios" class="tab-btn flex-1 py-2 flex flex-col items-center gap-0.5 transition-colors" aria-selected="false">
    <svg class="h-5 w-5 ico"><use href="#i-moto"/></svg>
    <span class="text-[11px] font-semibold">Domicilios</span>
  </button>
  <button data-accion="tab" data-tab="cocina" id="tab-cocina" class="tab-btn flex-1 py-2 flex flex-col items-center gap-0.5 relative transition-colors" aria-selected="false">
    <svg class="h-5 w-5 ico"><use href="#i-fuego"/></svg>
    <span class="text-[11px] font-semibold">Cocina</span>
    <span id="cocinaBadge" class="hidden absolute top-1 right-1/2 translate-x-4 bg-red-500 text-white text-[10px] font-bold min-w-[18px] h-[18px] grid place-items-center rounded-full px-1">0</span>
  </button>
  <button data-accion="tab" data-tab="caja" id="tab-caja" class="tab-btn flex-1 py-2 flex flex-col items-center gap-0.5 transition-colors" aria-selected="false">
    <svg class="h-5 w-5 ico"><use href="#i-caja"/></svg>
    <span class="text-[11px] font-semibold">Caja</span>
  </button>
</nav>

<!-- ================= MODAL GENÉRICO ================= -->
<div id="modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="absolute inset-0 bg-slate-900/60" data-accion="cerrar-modal"></div>
  <div class="relative h-full w-full flex items-end sm:items-center justify-center sm:p-4 pointer-events-none">
    <div id="modalPanel" class="pointer-events-auto w-full max-w-lg bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92dvh] flex flex-col overflow-hidden">
      <div class="px-4 py-3 bg-red-600 text-white flex items-center justify-between gap-2 shrink-0">
        <h3 id="modalTitulo" class="font-bold text-base truncate">Título</h3>
        <button data-accion="cerrar-modal" class="shrink-0 -mr-1 h-9 w-9 grid place-items-center rounded-lg hover:bg-white/15" aria-label="Cerrar">
          <svg class="h-5 w-5 ico"><use href="#i-x"/></svg>
        </button>
      </div>
      <div id="modalCuerpo" class="overflow-y-auto flex-1 px-4 py-3"></div>
      <div id="modalPie" class="border-t border-slate-200 bg-slate-50 px-4 py-3 shrink-0"></div>
    </div>
  </div>
</div>

<!-- ================= AVISOS ================= -->
<div id="toasts" class="fixed inset-x-0 top-16 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

<script src="app.js"></script>
</body>
</html>
